[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "amrq"
version = "1.0.0"
description = "AMR-Q — Quantum-Assisted Antibiotic Resistance Fighter: VQE + ML screening of resistance-breaking antibiotic candidates"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Shreyas Deraje" }]
keywords = ["quantum-computing", "vqe", "qiskit", "antimicrobial-resistance", "drug-discovery", "cheminformatics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
]

[tool.setuptools.packages.find]
include = ["amrq*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
